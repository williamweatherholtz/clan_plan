{% extends "layout_auth.html" %}

{% block title %}Set new password{% endblock %}
{% block heading %}Set a new password{% endblock %}

{% block content %}
<form action="/reset-password" method="post" class="space-y-5">
  <input type="hidden" name="token" value="{{ token }}">
  <div>
    <label for="password" class="block text-sm mb-1.5 smallcaps">New password</label>
    <input id="password" name="password" type="password" required autocomplete="new-password" minlength="8" class="w-full">
    <p class="mt-1.5 text-xs" style="color: var(--ink-3);">At least 8 characters</p>
  </div>
  <button type="submit" class="btn-primary w-full">
    Set new password →
  </button>
</form>
{% endblock %}
