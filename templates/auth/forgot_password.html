{% extends "layout_auth.html" %}

{% block title %}Reset password{% endblock %}
{% block heading %}Reset your password{% endblock %}

{% block content %}
<form action="/forgot-password" method="post" class="space-y-5">
  <p class="text-sm" style="color: var(--ink-2);">
    Enter your email address and we'll send you a link to reset your password.
  </p>
  <div>
    <label for="email" class="block text-sm mb-1.5 smallcaps">Email</label>
    <input id="email" name="email" type="email" required autocomplete="email" class="w-full">
  </div>
  <button type="submit" class="btn-primary w-full">
    Send reset link →
  </button>
</form>
<p class="mt-6 text-center text-sm">
  <a href="/login" style="color: var(--ink-3);">← Back to sign in</a>
</p>
{% endblock %}
