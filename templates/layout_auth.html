<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Clan Plan{% endblock %} — Clan Plan</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <meta name="theme-color" content="#1E3A2A">
  <!-- Anti-flash -->
  <script>
    (function(){
      var t = localStorage.getItem('theme') || 'system';
      if (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
      document.documentElement.setAttribute('data-theme-pref', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=Geist:wght@300..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/tailwind.css">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="h-full">
  <div id="toast-container"></div>

  <!-- Theme cycle, top-right -->
  <button type="button" onclick="cycleTheme()" class="theme-cycle fixed top-4 right-4 z-50" title="Toggle theme (light · system · dark)" aria-label="Toggle theme">
    <svg class="ic ic-light"  fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path stroke-linecap="round" d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6L19 19M5 19l1.4-1.4M17.6 6.4L19 5"/></svg>
    <svg class="ic ic-system" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="13" rx="1.5"/><path stroke-linecap="round" d="M8 20.5h8M12 17.5v3"/></svg>
    <svg class="ic ic-dark"   fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.7 6.7 0 0 0 9.8 9.8z"/></svg>
  </button>

  <div class="min-h-full flex flex-col justify-center py-16 sm:px-6 lg:px-8 relative">
    <!-- Wordmark -->
    <div class="sm:mx-auto sm:w-full sm:max-w-sm text-center mb-10">
      <h1 class="font-display text-5xl leading-none tracking-tight" style="color: var(--ink); font-variation-settings: 'opsz' 144, 'SOFT' 0, 'wght' 520, 'WONK' 0;">
        Clan Plan
      </h1>
      <p class="mt-3 text-sm" style="color: var(--ink-3); font-family: var(--display); font-style: italic; font-size: 14px; font-variation-settings: 'opsz' 144, 'SOFT' 30, 'wght' 400;">
        the plan for our clan.
      </p>
    </div>

    <div class="sm:mx-auto sm:w-full sm:max-w-md relative">
      <h2 class="text-center text-base font-bold mb-5 smallcaps" style="color: var(--ink-3);">{% block heading %}{% endblock %}</h2>

      {% if let Some(f) = flash %}
      <div class="mb-4 px-4 py-3 border text-sm font-semibold"
        style="
        {% if f.kind == "error" %}background: var(--rose-lt); border-color: var(--burgundy); color: var(--burgundy);
        {% else if f.kind == "success" %}background: rgba(30,58,42,.08); border-color: var(--moss); color: var(--moss);
        {% else %}background: var(--bg-2); border-color: var(--rule); color: var(--ink-2);{% endif %}">
        {{ f.text }}
      </div>
      {% endif %}

      <div class="auth-card py-8 px-6 sm:px-10">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>

  <script src="/assets/app.js"></script>
</body>
</html>
