<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Clan Plan{% endblock %} — Clan Plan</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/favicon.svg">
  <meta name="theme-color" content="#1E3A2A">
  <!-- Anti-flash -->
  <script>
    (function(){
      var t = localStorage.getItem('theme') || 'system';
      if (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
      document.documentElement.setAttribute('data-theme-pref', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=Geist:wght@300..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/tailwind.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="min-h-full" data-user-name="{{ user_name }}">
  <div id="toast-container"></div>

  <!-- ── Navigation ────────────────────────────────────────────────────── -->
  <nav class="app-nav sticky top-0 z-40" x-data="{ mobileOpen: false }">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">

        <!-- Logo + breadcrumb -->
        <div class="flex items-center gap-3 min-w-0 flex-1">
          <a href="/dashboard" class="nav-logo flex items-center select-none flex-shrink-0">
            Clan Plan
          </a>
          {% block breadcrumb %}{% endblock %}
        </div>

        <!-- Right side -->
        <div class="flex items-center gap-2">

          <!-- Theme cycle: click to advance light → system → dark → light -->
          <button id="theme-toggle" type="button" onclick="cycleTheme()" class="theme-cycle" title="Toggle theme (light · system · dark)" aria-label="Toggle theme">
            <svg class="ic ic-light"  fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path stroke-linecap="round" d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6L19 19M5 19l1.4-1.4M17.6 6.4L19 5"/></svg>
            <svg class="ic ic-system" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="13" rx="1.5"/><path stroke-linecap="round" d="M8 20.5h8M12 17.5v3"/></svg>
            <svg class="ic ic-dark"   fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.7 6.7 0 0 0 9.8 9.8z"/></svg>
          </button>

          <!-- User menu -->
          <div class="relative" x-data="{ open: false }">
            <button @click="open = !open"
                    class="flex items-center gap-1.5 px-3 py-1.5 text-sm font-semibold transition-colors focus:outline-none"
                    style="color: var(--ink-2)">
              <span class="hidden sm:block">{{ user_name }}</span>
              <svg class="w-3.5 h-3.5 transition-transform" :class="open ? 'rotate-180' : ''" fill="currentColor" viewBox="0 0 20 20" style="color: var(--ink-3)">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
              </svg>
            </button>
            <div x-show="open" @click.away="open = false" x-cloak
                 class="absolute right-0 mt-1 w-48 py-1 z-50"
                 style="background: var(--surface); border: 1px solid var(--rule); box-shadow: 4px 4px 0 var(--shadow-hard);">
              <a href="/profile" class="block px-4 py-2 text-sm transition-colors" style="color: var(--ink-2)">Profile</a>
              <a href="/dashboard" class="block px-4 py-2 text-sm transition-colors" style="color: var(--ink-2)">Reunions</a>
              {% if is_sysadmin %}
              <a href="/admin" class="block px-4 py-2 text-sm transition-colors" style="color: var(--ink-2)">Admin Panel</a>
              {% endif %}
              <hr class="my-1" style="border-color: var(--rule-soft);">
              <button onclick="apiFetch('POST','/auth/logout').catch(()=>{}).finally(()=>{ window.location.href='/login'; })"
                      class="w-full text-left px-4 py-2 text-sm transition-colors" style="color: var(--burgundy);">
                Sign out
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </nav>

  <!-- Flash message -->
  {% if let Some(f) = flash %}
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4">
    <div class="px-4 py-3 border text-sm font-semibold"
      style="
      {% if f.kind == "error" %}background: var(--rose-lt); border-color: var(--burgundy); color: var(--burgundy);
      {% else if f.kind == "success" %}background: rgba(30,58,42,.08); border-color: var(--moss); color: var(--moss);
      {% else %}background: var(--bg-2); border-color: var(--rule); color: var(--ink-2);{% endif %}">
      {{ f.text }}
    </div>
  </div>
  {% endif %}

  <!-- Main content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
  </main>

  <script src="/assets/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
